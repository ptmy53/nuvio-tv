name: Deploy to GitHub Pages

# Runs on every push to main and can be triggered by hand. The heavy lifting
# lives in build-deploy.yml so the upstream sync workflow can reuse it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/build-deploy.yml
    secrets: inherit
    permissions:
      contents: write
